# Jupyter Book 2 / MyST configuration.
# This single file replaces the Jupyter Book 1 `_config.yml` and `_toc.yml`.
# Reference: https://mystmd.org/guide/frontmatter and https://mystmd.org/guide/table-of-contents
version: 1
project:
  title: Large Language Models for HEP and Nuclear Physics
  authors:
    - name: HSF Training
  copyright: '2026'
  license: CC-BY-4.0
  # Used to build "edit on GitHub" / source links.
  github: hsf-training/hsf-training-llms-for-hep
  # BibTeX files for {cite} roles and the {bibliography} directive.
  bibliography:
    - references.bib
  # Table of contents. Only files listed here are built; the first entry is the landing page.
  toc:
    - file: intro.md
    - file: setup.md
    - file: 01-introduction.md
    - file: 03-prompt-engineering.md
    - file: output_validation.md
    - file: building-sustainable-software.md
    - title: Toolkit
      children:
        - file: toolkit/01-agents-md.md
        - file: toolkit/02-skills.md
        # The memory chapter goes here as toolkit/03-*.md.
site:
  template: book-theme
  options:
    logo: hsf-logo.png
    folders: true
